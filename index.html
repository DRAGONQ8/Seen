/* Seen Game Khaled · native, offline typography and device-adaptive RTL UI. */
:root {
  color-scheme: dark;
  --bg: #090d1e;
  --bg-alt: #0d1228;
  --panel: #12192e;
  --panel-raised: #19213b;
  --panel-hover: #202944;
  --text: #f3f4fb;
  --muted: #a5aec8;
  --soft: #7985a7;
  --line: #27304a;
  --gold: #f0cb79;
  --gold-dark: #b18435;
  --cyan: #5ed9eb;
  --purple: #b695f9;
  --success: #65dfb0;
  --danger: #ff8c9e;
  --shadow: 0 18px 52px #0003;
  --radius: 22px;
  --font: "Noto Sans Arabic", Tahoma, "Segoe UI", Arial, sans-serif;
}
html[data-theme="light"] {
  color-scheme: light;
  --bg: #f2f3f8;
  --bg-alt: #e9ecf5;
  --panel: #fff;
  --panel-raised: #f2f4fb;
  --panel-hover: #e9edf8;
  --text: #18213b;
  --muted: #59657f;
  --soft: #62708b;
  --line: #d8deec;
  --gold: #8d6011;
  --gold-dark: #9c6e1c;
  --cyan: #087788;
  --purple: #7754b8;
  --success: #137a56;
  --danger: #b33450;
  --shadow: 0 15px 45px #2433550b;
}
* { box-sizing: border-box; }
html { min-width: 280px; font-size: calc(16px * var(--text-scale, 1)); scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-width: 280px; min-height: 100vh; min-height: 100dvh;
  font-family: var(--font); font-size: .9375rem; line-height: 1.7;
  background: var(--bg); color: var(--text);
  -webkit-tap-highlight-color: transparent;
  background-image: radial-gradient(ellipse at 0 15%, #33256e23, transparent 45%);
}
button, input, select, textarea { font: inherit; }
button, input, select { touch-action: manipulation; }
button { cursor: pointer; color: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { -webkit-appearance: none; appearance: none; }
a { color: var(--cyan); text-underline-offset: 4px; }
button:disabled { cursor: default; opacity: .48; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 4px; }
input:focus-visible, select:focus-visible { outline-offset: 1px; }
main:focus { outline: none; }
svg { max-width: 100%; vertical-align: middle; }
.icon { width: 22px; height: 22px; flex-shrink: 0; display: inline-block; vertical-align: middle; }
img { display: block; max-width: 100%; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { line-height: 1.55; }
h1 { font-size: clamp(1.9rem, 3vw, 2.7rem); font-weight: 800; }

.center { text-align: center; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }

 العرب في الجاهلية وصدر الإسلام: لمحة تاريخية","url":"https://www.hindawi.org/books/48607936/1/","reference":"الحضارة والكتابة في جنوب الجزيرة"},"spoiler":false,"tags":["الكتابات القديمة"],"version":1,"hint":"يختلف عن الخطوط العربية المتأخرة المستخدمة في المخطوطات."},{"id":"arabia-009","category":"arabia","sub":"التجارة القديمة","level":2,"q":"أي سلعتين عطريتين ارتبطتا بطريق البخور في جنوب الجزيرة؟","options":["اللبان والمر","الفحم والحديد","القمح والشعير","الملح والسكر"],"answer":0,"explanation":"ساعدت تجارة اللبان والمر على ازدهار طرق القوافل والممالك الجنوبية.","source":{"title":"اليونسكو: معالم مملكة سبأ القديمة في مأرب","url":"https://whc.unesco.org/en/list/1700/","reference":"شبكات تجارة البخور"},"spoiler":false,"tags":["التجارة القديمة"],"version":1,"hint":"كانتا تستخدمان في التطييب والتبخير."},{"id":"arabia-010","category":"arabia","sub":"القبائل","level":1,"q":"في أي واحة استقر الأوس والخزرج قبل الإسلام؟","options":["يثرب","نجران","خيبر","تيماء"],"answer":0,"explanation":"الأوس والخزرج من أبرز قبائل يثرب، التي عرفت لاحقًا بالمدينة المنورة.","source":{"title":"أدباء العرب في الجاهلية وصدر الإسلام: لمحة تاريخية","url":"https://www.hindawi.org/books/48607936/1/","reference":"أحوال الحجاز وقبائله"},"spoiler":false,"tags":["القبائل"],"version":1,"hint":"هي المدينة التي هاجر إليها المسلمون فيما بعد."},{"id":"arabia-011","category":"arabia","sub":"القبائل","level":1,"q":"بأي مدينة ارتبطت قريش في العصر السابق للإسلام؟","options":["مكة","صنعاء","الحيرة","تدمر"],"answer":0,"explanation":"ارتبطت قريش بمكة وبخدمة الكعبة والتجارة.","source":{"title":"أدباء العرب في الجاهلية وصدر الإسلام: لمحة تاريخية","url":"https://www.hindawi.org/books/48607936/1/","reference":"قريش ومكة"},"spoiler":false,"tags":["القبائل"],"version":1,"hint":"تقع في الحجاز وتضم الكعبة."},{"id":"arabia-012","category":"arabia","sub":"القبائل","level":3,"q":"إلى أي تجمع قبلي ينتسب بنو عبس في كتب الأنساب؟","options":["غطفان","قضاعة","طيء","كندة"],"answer":0,"explanation":"تنسب المصادر عبس إلى غطفان، مثل ط به الروايات نشوب حرب داحس والغبراء؟","options":["نزاع على سباق خيل","حصار مدينة بحرية","نزاع على منجم ذهب","غرق أسطول تجاري"],"answer":0,"explanation":"تربط الروايات حرب داحس والغبراء بالتنافس والغش في سباق خيل، مع اختلاف التفاصيل.","source":{"title":"ابن هشام: روايات حرب داحس","url":"https://www.islamweb.org/ar/library/content/58/310/حرب-داحس","reference":"خبر السباق واختلاف رواياته"},"spoiler":false,"tags":["أيام العرب"],"version":1,"hint":"اسما الحرب هما اسمان لخيل في الروايات."},{"id":"arabia-021","category":"arabia","sub":"أيام العرب","level":3,"q":"إلى من تنسب رواية ابن هشام ملكية الفرس داحس؟","options":["قيس بن زهير","حاتم الطائي","امرؤ القيس","النعمان بن المنذر"],"answer":0,"explanation":"تذكر رواية ابن هشام أن داحس فرس لقيس بن زهير العبسي، وتورد اختلافًا في تفاصيل السباق.","source":{"title":"ابن هشام: روايات حرب داحس","url":"https://www.islamweb.org/ar/library/content/58/310/حرب-داحس","reference":"رواية أبي عبيدة عن ملكية داحس"},"spoiler":false,"tags":["أيام العرب"],"version":1,"hint":"هو أحد زعماء بني عبس."},{"id":"arabia-022","category":"arabia","sub":"السلم القبلي","level":3,"q":"أي ثنائي مدحه زهير لمسعاه في الصلح بين عبس وذبيان؟","options":["هرم بن سنان والحارث بن عوف","جساس وكليب","عمرو بن هند وقابوس","قصي وهاشم"],"answer":0,"explanation":"مدح زهير هرم بن سنان والحارث بن عوف لتحملهما تبعات الصلح والديات في الرواية الأدبية.","source":{"title":"تاريخ آداب العرب: زهير بن أبي سلمى","url":"https://www.hindawi.org/books/70629206/3.36/","reference":"مديح الصلح في معلقة زهير"},"spoiler":false,"tags":["السلم القبلي"],"version":1,"hint":"ارتبط مدحهما بإيقاف الحرب وتحمل الديات."},{"id":"arabia-023","category":"arabia","sub":"أيام العرب","level":2,"q":"في أخبار يوم ذي قار، واجهت قبائل بكر قوة مرتبطة بأي دولة؟","options":["الدولة الساسانية","الدولة الأموية","الدولة العباسية","الدولة العثمانية"],"answer":0,"explanation":"يرتبط يوم ذي قار بمواجهة بكر بن وائل للقوة الساسانية وحلفائها، وتختلف الروايات في التأريخ والتفاصيل.","source":{"title":"إيرانيكا: العرب وإيران ق ic","sub":"السلاجقة","level":2,"q":"من القائد السلجوقي المنتصر في ملاذكرد سنة 1071م؟","options":["ألب أرسلان","صلاح الدين","قطز","محمد الفاتح"],"answer":0,"explanation":"انتصر ألب أرسلان على الجيش البيزنطي في ملاذكرد سنة 463هـ/1071م.","source":{"title":"متحف المتروبوليتان: الفن السلجوقي في الأناضول","url":"https://www.metmuseum.org/essays/the-art-of-the-seljuq-period-in-anatolia-1081-1307","reference":"معركة ملاذكرد وبداية التوسع في الأناضول"},"spoiler":false,"tags":["السلاجقة"],"version":1,"hint":"اسمه التركي يعني الأسد الشجاع."},{"id":"islamic-033","category":"islamic","sub":"السلاجقة","level":4,"q":"من الوزير الذي ارتبطت باسمه المدارس النظامية؟","options":["نظام الملك","ابن العلقمي","ابن مقلة","الصاحب بن عباد"],"answer":0,"explanation":"ارتبط تأسيس شبكة المدارس النظامية بالوزير السلجوقي نظام الملك في القرن 11م.","source":{"title":"إيرانيكا: نظام الملك","url":"https://www.iranicaonline.org/articles/nezam-al-molk/","reference":"الرعاية التعليمية في العهد السلجوقي"},"spoiler":false,"tags":["السلاجقة"],"version":1,"hint":"يحمل اسم المدارس لقبه."},{"id":"islamic-034","category":"islamic","sub":"العلوم","level":1,"q":"من مؤلف كتاب «الجبر والمقابلة»؟","options":["محمد بن موسى الخوارزمي","ابن خلدون","الإدريسي","ابن بطوطة"],"answer":0,"explanation":"ألف الخوارزمي كتابًا في الجبر والمقابلة، وكان من أبرز علماء الرياضيات في العصر العباسي.","source":{"title":"جامعة سانت أندروز: الخوارزمي","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Al-Khwarizmi/","reference":"مؤلفات الخوارزمي في الجبر"},"spoiler":false,"tags":["العلوم"],"version":1,"hint":"اشتقت كلمة خوارزمية من اسمه في اللغات الأوروبية."},{"id":"islamic-035","category":"islamic","sub":"العلوم","level":1,"q":"من صاحب كتاب «المناظر» في علم الضوء؟","options":["الحسن بن الهيثم","ابن سينا","ابن رشد","ابن خلدون"],"answer":0,"explanation":"درس ابن الهيثم الضوء والإبصار في كتاب المناظر، وله إسهامات في المنهج التجريبي.","source":{"title":"جامعة سانت أندروز: ابن الهيثم","url":"https://mathshistory.st-andrews.ac.uk/Biograp ran.com/11/44","reference":"سورة هود، الآية 44"},"spoiler":false,"tags":["نوح عليه السلام","قرآن"],"version":1,"hint":"اسمه ليس من الجبال المرتبطة بمناسك الحج."},{"id":"prophets-005","category":"prophets","sub":"نوح عليه السلام","level":2,"q":"إلى ماذا قال ابن نوح إنه سيأوي ليحتمي من الماء؟","options":["جبل","قصر","غار","سور"],"answer":0,"explanation":"قال إنه سيأوي إلى جبل يعصمه من الماء، فبيّن نوح أنه لا عاصم من أمر الله إلا من رحم.","source":{"title":"القرآن الكريم","url":"https://quran.com/11/43","reference":"سورة هود، الآية 43"},"spoiler":false,"tags":["نوح عليه السلام","قرآن"],"version":1,"hint":"اختار موضعًا مرتفعًا."},{"id":"prophets-006","category":"prophets","sub":"إبراهيم عليه السلام","level":2,"q":"ما الاسم الذي ورد لأبي إبراهيم عليه السلام في سورة الأنعام؟","options":["آزر","عمران","يعقوب","تارح"],"answer":0,"explanation":"يسمي النص القرآني أبا إبراهيم آزر في سورة الأنعام؛ والسؤال مقيد بما ورد في القرآن.","source":{"title":"القرآن الكريم","url":"https://quran.com/6/74","reference":"سورة الأنعام، الآية 74"},"spoiler":false,"tags":["إبراهيم عليه السلام","قرآن"],"version":1,"hint":"اسم قصير ورد صراحة في الآية."},{"id":"prophets-007","category":"prophets","sub":"إبراهيم عليه السلام","level":1,"q":"من شارك إبراهيم عليه السلام في رفع قواعد البيت؟","options":["إسماعيل عليه السلام","إسحاق عليه السلام","يوسف عليه السلام","هارون عليه السلام"],"answer":0,"explanation":"تذكر سورة البقرة إبراهيم وإسماعيل عند رفع قواعد البيت والدعاء بالقبول.","source":{"title":"القرآن الكريم","url":"https://quran.com/2/127","reference":"سورة البقرة، الآية 127"},"spoiler":false,"tags":["إبراهيم عليه السلام","قرآن"],"version":1,"hint":"هو أحد ابني إبراهيم المذكورين في القرآن."},{"id":"prophets-008","category":"prophets","sub":"إبراهيم عليه السلام","level":1,"q":"لمن أمر الله النار أن تكون بردًا وسلامًا؟","options":["إبراهيم عليه السلام","نوح عليه السلام","داود عليه السلام","يونس عليه السلام"],"answer":0,"explanation":"ورد أمر الله للنار أن تكون بردًا وسلامًا على إبراهيم في سورة الأنبياء.","source":{"title":"القرآن الكريم","url":"https://quran.com/21/69","reference":"سورة الأنبياء، الآية 69"},"spoiler":false,"tags":["إبراهيم عليه السلام","قرآن"],"version":1,"hint":"ارتبطت قصته بتحطيم الأصنام."},{"id":"prophets-009","category":"prophets","sub":"إبراهيم عليه السلام","level":4,"q":"كم طائرًا أُمر إبراهيم عليه السلام أن يأخذ في قصة الاطمئنان إلى إحياء الموتى؟","options":["4","2","7","10"],"answer":0,"explanation":"ورد العدد أربعة في سورة البقرة عند سؤال إبراهيم عن كيفية إحياء الموتى.","source":{"title":"القرآن الكريم","url":"https://quran.com/2/260","reference":"سورة البقرة، الآية 260"},"spoiler":false,"tags":["إبراهيم عليه السلام","قرآن"],"version":1,"hint":"عدد زوجي أقل من 5."},{"id":"prophets-010","category":"prophets","sub":"لوط عليه السلام","level":3,"q":"أي نبي تذكر سورة العنكبوت أنه آمن لإبراهيم عليه السلام؟","options":["لوط عليه السلام","موسى عليه السلام","شعيب عليه السلام","صالح عليه السلام"],"answer":0,"explanation":"تقول الآية إن لوطًا آمن له في سياق قصة إبراهيم.","source":{"title":"القرآن الكريم","url":"https://quran.com/29/26","reference":"سورة العنكبوت، الآية 26"},"spoiler":false,"tags":["لوط عليه السلام","قرآن"],"version":1,"hint":"ارتبطت رسالته بقوم اشتهروا بفاحشة أنكرها عليهم."},{"id":"prophets-011","category":"prophets","sub":"يوسف عليه السلام","level":1,"q":"كم كوكبًا رأى يوسف عليه السلام في رؤياه مع الشمس والقمر؟","options":["11","7","12","9"],"answer":0,"explanation":"ذكر يوسف لأبيه أنه رأى أحد عشر كوكبًا والشمس والقمر يسجدون له.","source":{"title":"القرآن الكريم","url":"https://quran.com/12/4","reference":"سورة يوسف، الآية 4"},"spoiler":false,"tags":["يوسف عليه السلام","قرآن"],"version":1,"hint":"عدد فردي يقع بين 10 و12."},{"id":"prophets-012","category":"prophets","sub":"يوسف عليه السلام","level":1,"q":"أين ألقى إخوة يوسف عليه السلام أخاهم؟","options":["في غيابة الجب","في البحر","في غار","في قصر مهجور"],"answer":0,"explanation":"تذكر سورة يوسف اتفاقهم على وضعه في غيابة الجب، أي قعر البئر.","source":{"title":"القرآن الكريم","url":"https://quran.com/12/15","reference":"سورة يوسف، الآية 15"},"spoiler":false,"tags":["يوسف عليه السلام","قرآن"],"version":1,"hint":"موضع تُستخرج منه المياه عادة."},{"id":"prophets-013","category":"prophets","sub":"يوسف عليه السلام","level":2,"q":"بماذا جاء إخوة يوسف على قميصه لإيهام أبيهم بموته؟","options":["بدم كذب","بماء البحر","بطين النهر","بصبغة زرقاء"],"answer":0,"explanation":"تصف سورة يوسف الدم الذي وضعوه على قميصه بأنه دم كذب.","source":{"title":"القرآن الكريم","url":"https://quran.com/12/18","reference":"سورة يوسف، الآية 18"},"spoiler":false,"tags":["يوسف عليه السلام","قرآن"],"version":1,"hint":"زعموا أن الذئب أكله."},{"id":"prophets-014","category":"prophets","sub":"يوسف عليه السلام","level":3,"q":"ما عدد البقرات السمان في رؤيا الملك التي فسّرها يوسف عليه السلام؟","options":["7","5","9","12"],"answer":0,"explanation":"تذكر رؤيا الملك سبع بقرات سمان تأكلهن سبع عجاف.","source":{"title":"القرآن الكريم","url":"https://quran.com/12/43","reference":"سورة يوسف، الآية 43"},"spoiler":false,"tags":["يوسف عليه السلام","قرآن"],"version":1,"hint":"هو أيضًا عدد السنبلات الخضر في الرؤيا."},{"id":"prophets-015","category":"prophets","sub":"يوسف عليه السلام","level":3,"q":"ما الذي رأى أحد صاحبي يوسف في السجن أنه يحمله فوق رأسه وتأكل الطير منه؟","options":["خبزًا","ذهبًا","ماءً","حطبًا"],"answer":0,"explanation":"ذكر أحد الفتيين أنه يحمل خبزًا فوق رأسه وتأكل الطير منه، وطلبا تأويل رؤياهما.","source":{"title":"القرآن الكريم","url":"https://quran.com/12/36","reference":"سورة يوسف، الآية 36"},"spoiler":false,"tags":["يوسف عليه السلام","قرآن"],"version":1,"hint":"شيء يؤكل ويُصنع من الحبوب."},{"id":"prophets-016","category":"prophets","sub":"يوسف عليه السلام","level":2,"q":"على ماذا طلب يوسف عليه السلام أن يُولّى عندما قال إنه حفيظ عليم؟","options":["خزائن الأرض","قيادة الأسطول","حراسة السجن","بناء القصور"],"answer":0,"explanation":"طلب يوسف أن يُجعل على خزائن الأرض وذكر حفظه وعلمه.","source":{"title":"القرآن الكريم","url":"https://quran.com/12/55","reference":"سورة يوسف، الآية 55"},"spoiler":false,"tags":["يوسف عليه السلام","قرآن"],"version":1,"hint":"تتصل المهمة بإدارة الموارد."},{"id":"prophets-017","category":"prophets","sub":"يوسف عليه السلام","level":3,"q":"من عاد بصيرًا حين أُلقي قميص يوسف على وجهه؟","options":["يعقوب عليه السلام","إسحاق عليه السلام","إبراهيم عليه السلام","أيوب عليه السلام"],"answer":0,"explanation":"عاد يعقوب بصيرًا عندما جاء البشير وألقى القميص على وجهه؛ ويُفهم مرجع الضمير من سياق القصة.","source":{"title":"القرآن الكريم","url":"https://quran.com/12/96","reference":"سورة يوسف، الآية 96"},"spoiler":false,"tags":["يوسف عليه السلام","قرآن"],"version":1,"hint":"هو والد يوسف."},{"id":"prophets-018","category":"prophets","sub":"موسى عليه السلام","level":2,"q":"في أي شيء أُمِرت أم موسى أن تضعه ثم تقذفه في اليم؟","options":["التابوت","السفينة الكبيرة","جرة فخار","سلة حديد"],"answer":0,"explanation":"تذكر سورة طه أمر وضع موسى في التابوت ثم إلقائه في اليم.","source":{"title":"القرآن الكريم","url":"https://quran.com/20/39","reference":"سورة طه، الآية 39"},"spoiler":false,"tags":["موسى عليه السلام","قرآن"],"version":1,"hint":"اسم الوعاء مذكور صراحة في سورة طه."},{"id":"prophets-019","category":"prophets","sub":"موسى عليه السلام","level":2,"q":"من تتبعت أثر موسى الرضيع بتوجيه من أمه؟","options":["أخته","زوجة فرعون","ابنة الملك","خالة يوسف"],"answer":0,"explanation":"قالت أم موسى لأخته أن تتقصى خبره، فراقبته من بُعد وهم لا يشعرون.","source":{"title":"القرآن الكريم","url":"https://quran.com/28/11","reference":"سورة القصص، الآية 11"},"spoiler":false,"tags":["موسى عليه السلام","قرآن"],"version":1,"hint":"هي من أسرته القريبة."},{"id":"prophets-020","category":"prophets","sub":"موسى عليه السلام","level":2,"q":"إلى أي جهة توجّه موسى عليه السلام بعد خروجه خائفًا من المدينة؟","options":["مدين","سبأ","بابل","مكة"],"answer":0,"explanation":"تذكر سورة القصص توجه موسى تلقاء مدين ودعاءه أن يهديه الله سواء السبيل.","source":{"title":"القرآن الكريم","url":"https://quran.com/28/22","reference":"سورة القصص، الآية 22"},"spoiler":false,"tags":["موسى عليه السلام","قرآن"],"version":1,"hint":"ارتبطت هذه الجهة بقصة سقيه للمرأتين."},{"id":"prophets-021","category":"prophets","sub":"موسى عليه السلام","level":4,"q":"ما مدة العمل الأصلية المشروطة على موسى في عرض الزواج، قبل الزيادة الاختيارية إلى 10؟","options":["8 سنوات","4 سنوات","6 سنوات","12 سنة"],"answer":0,"explanation":"نص العرض على ثماني حجج، مع إتاحة إتمام عشر من عند موسى. ولا يسمي القرآن أبا المرأتين في هذا الموضع.","source":{"title":"القرآن الكريم","url":"https://quran.com/28/27","reference":"سورة القصص، الآية 27"},"spoiler":false,"tags":["موسى عليه السلام","قرآن"],"version":1,"hint":"المدة الأصلية أقل من 10 بسنتين."},{"id":"prophets-022","category":"prophets","sub":"موسى عليه السلام","level":1,"q":"من الأخ الذي طلب موسى أن يجعله الله وزيرًا له؟","options":["هارون عليه السلام","يوسف عليه السلام","إسماعيل عليه السلام","يحيى عليه السلام"],"answer":0,"explanation":"طلب موسى وزيرًا من أهله وسمّى هارون أخاه؛ ورد ذلك في طه 29–32.","source":{"title":"القرآن الكريم","url":"https://quran.com/20/30","reference":"سورة طه، الآية 30"},"spoiler":false,"tags":["موسى عليه السلام","قرآن"],"version":1,"hint":"شارك موسى مواجهة فرعون."},{"id":"prophets-023","category":"prophets","sub":"موسى عليه السلام","level":1,"q":"إلى ماذا تحولت عصا موسى عندما ألقاها كما تصف سورة طه؟","options":["حية تسعى","طائر أبيض","شجرة","سيف"],"answer":0,"explanation":"تذكر سورة طه أن موسى ألقى عصاه فإذا هي حية تسعى، آية من الله.","source":{"title":"القرآن الكريم","url":"https://quran.com/20/20","reference":"سورة طه، الآية 20"},"spoiler":false,"tags":["موسى عليه السلام","قرآن"],"version":1,"hint":"مخلوق يتحرك على الأرض دون أرجل."},{"id":"prophets-024","category":"prophets","sub":"موسى عليه السلام","level":2,"q":"بماذا أُمر موسى عليه السلام أن يضرب البحر فانفلق؟","options":["بعصاه","بيده","بحجر","بدرع"],"answer":0,"explanation":"تذكر سورة الشعراء الأمر بضرب البحر بالعصا، فانفلق وصار كل فرق كالطود العظيم.","source":{"title":"القرآن الكريم","url":"https://quran.com/26/63","reference":"سورة الشعراء، الآية 63"},"spoiler":false,"tags":["موسى عليه السلام","قرآن"],"version":1,"hint":"أداة كانت معه في مواقف أخرى من قصته."},{"id":"prophets-025","category":"prophets","sub":"موسى عليه السلام","level":4,"q":"من ارتبط بإخراج العجل ذي الخوار في سورة طه؟","options":["السامري","هامان","قارون","طالوت"],"answer":0,"explanation":"ورد اسم السامري في طه 87، ثم وُصف إخراج العجل ذي الخوار في الآية 88.","source":{"title":"القرآن الكريم","url":"https://quran.com/20/87","reference":"سورة طه، الآية 87"},"spoiler":false,"tags":["موسى عليه السلام","قرآن"],"version":1,"hint":"ليس وزير فرعون ولا صاحب الكنوز."},{"id":"prophets-026","category":"prophets","sub":"داود عليه السلام","level":1,"q":"أي كتاب آتى الله داود عليه السلام؟","options":["الزبور","الإنجيل","التوراة","القرآن"],"answer":0,"explanation":"تنص سورة النساء على أن الله آتى داود زبورًا.","source":{"title":"القرآن الكريم","url":"https://quran.com/4/163","reference":"سورة النساء، الآية 163"},"spoiler":false,"tags":["داود عليه السلام","قرآن"],"version":1,"hint":"كتاب ذُكر مقترنًا باسم داود."},{"id":"prophets-027","category":"prophets","sub":"داود عليه السلام","level":2,"q":"أي معدن ألان الله لداود عليه السلام؟","options":["الحديد","الذهب","الفضة","النحاس"],"answer":0,"explanation":"تذكر سورة سبأ أن الله ألان الحديد لداود، ثم تذكر صناعة السابغات في الآية التالية.","source":{"title":"القرآن الكريم","url":"https://quran.com/34/10","reference":"سورة سبإ، الآية 10"},"spoiler":false,"tags":["داود عليه السلام","قرآن"],"version":1,"hint":"معدن يُستخدم لصناعة الدروع."},{"id":"prophets-028","category":"prophets","sub":"داود عليه السلام","level":2,"q":"من الذي قتله داود عليه السلام في المعركة الواردة بسورة البقرة؟","options":["جالوت","فرعون","النمرود","هامان"],"answer":0,"explanation":"تذكر الآية هزيمة الجيش المعادي بإذن الله وقتل داود لجالوت.","source":{"title":"القرآن الكريم","url":"https://quran.com/2/251","reference":"سورة البقرة، الآية 251"},"spoiler":false,"tags":["داود عليه السلام","قرآن"],"version":1,"hint":"كان خصمًا لجيش طالوت."},{"id":"prophets-029","category":"prophets","sub":"سليمان عليه السلام","level":1,"q":"أي طائر تفقده سليمان عليه السلام فلم يره؟","options":["الهدهد","الغراب","الحمام","النسر"],"answer":0,"explanation":"تذكر سورة النمل تفقد سليمان للطير وسؤاله عن غياب الهدهد.","source":{"title":"القرآن الكريم","url":"https://quran.com/27/20","reference":"سورة النمل، الآية 20"},"spoiler":false,"tags":["سليمان عليه السلام","قرآن"],"version":1,"hint":"عاد بخبر من سبأ."},{"id":"prophets-030","category":"prophets","sub":"سليمان عليه السلام","level":2,"q":"أي مخلوق حذر قومه من أن يحطمهم سليمان وجنوده وهم لا يشعرون؟","options":["نملة","نحلة","حمامة","فراشة"],"answer":0,"explanation":"تذكر سورة النمل قول نملة لقومها أن يدخلوا مساكنهم، ثم تبسم سليمان من قولها.","source":{"title":"القرآن الكريم","url":"https://quran.com/27/18","reference":"سورة النمل، الآية 18"},"spoiler":false,"tags":["سليمان عليه السلام","قرآن"],"version":1,"hint":"ارتبط اسمه باسم السورة."},{"id":"prophets-031","category":"prophets","sub":"سليمان عليه السلام","level":3,"q":"كيف وصف الهدهد حاكم سبأ في خبره إلى سليمان؟","options":["امرأة لها عرش عظيم","رجل بلا جنود","طفل لا يحكم بنفسه","جماعة بلا حاكم"],"answer":0,"explanation":"أخبر الهدهد أنه وجد امرأة تملكهم ولها عرش عظيم. ولا يذكر القرآن اسمها الشخصي.","source":{"title":"القرآن الكريم","url":"https://quran.com/27/23","reference":"سورة النمل، الآية 23"},"spoiler":false,"tags":["سليمان عليه السلام","قرآن"],"version":1,"hint":"القرآن يحدد صفتها دون تسمية شخصية."},{"id":"prophets-032","category":"prophets","sub":"سليمان عليه السلام","level":4,"q":"بأي عبارة افتُتح كتاب سليمان إلى حاكمة سبأ بعد ذكر مرسله؟","options":["بسم الله الرحمن الرحيم","الحمد لله رب العالمين","رب اغفر لي","إن مع العسر يسرًا"],"answer":0,"explanation":"تذكر سورة النمل أن الكتاب من سليمان وأنه افتُتح بالبسملة.","source":{"title":"القرآن الكريم","url":"https://quran.com/27/30","reference":"سورة النمل، الآية 30"},"spoiler":false,"tags":["سليمان عليه السلام","قرآن"],"version":1,"hint":"عبارة تبدأ بها قراءة معظم سور القرآن."},{"id":"prophets-033","category":"prophets","sub":"يونس عليه السلام","level":1,"q":"ما المخلوق الذي التقَم يونس عليه السلام؟","options":["الحوت","التمساح","الأسد","النسر"],"answer":0,"explanation":"تذكر سورة الصافات التقام الحوت ليونس في سياق قصته.","source":{"title":"القرآن الكريم","url":"https://quran.com/37/142","reference":"سورة الصافات، الآية 142"},"spoiler":false,"tags":["يونس عليه السلام","قرآن"],"version":1,"hint":"مخلوق يعيش في الماء."},{"id":"prophets-034","category":"prophets","sub":"يونس عليه السلام","level":3,"q":"ما الشجرة التي أنبتها الله على يونس عليه السلام بعد نبذه بالعراء؟","options":["اليقطين","الزيتون","النخيل","الرمان"],"answer":0,"explanation":"تذكر سورة الصافات إنبات شجرة من يقطين عليه.","source":{"title":"القرآن الكريم","url":"https://quran.com/37/146","reference":"سورة الصافات، الآية 146"},"spoiler":false,"tags":["يونس عليه السلام","قرآن"],"version":1,"hint":"نبات يرتبط بثمرة القرع."},{"id":"prophets-035","category":"prophets","sub":"يونس عليه السلام","level":2,"q":"بأي لقب ذُكر يونس عليه السلام في دعائه في سورة الأنبياء؟","options":["ذو النون","ذو القرنين","ذو الكفل","ذو الأيد"],"answer":0,"explanation":"ذُكر يونس بلقب ذي النون قبل دعائه في الظلمات. والنون من أسماء الحوت.","source":{"title":"القرآن الكريم","url":"https://quran.com/21/87","reference":"سورة الأنبياء، الآية 87"},"spoiler":false,"tags":["يونس عليه السلام","قرآن"],"version":1,"hint":"اللقب متعلق بالحوت."},{"id":"prophets-036","category":"prophets","sub":"عيسى عليه السلام","level":1,"q":"من النبي الذي تكلم في المهد وأعلن أنه عبد الله؟","options":["عيسى عليه السلام","إسحاق عليه السلام","شعيب عليه السلام","هود عليه السلام"],"answer":0,"explanation":"تذكر سورة مريم إشارة مريم إلى طفلها، ثم كلام عيسى معلنًا عبوديته لله ونبوته.","source":{"title":"القرآن الكريم","url":"https://quran.com/19/30","reference":"سورة مريم، الآية 30"},"spoiler":false,"tags":["عيسى عليه السلام","قرآن"],"version":1,"hint":"أمه مريم عليها السلام."},{"id":"prophets-037","category":"prophets","sub":"عيسى عليه السلام","level":2,"q":"أي كتابين تذكر آية آل عمران 48 أن الله يعلّمهما لعيسى عليه السلام؟","options":["التوراة والإنجيل","الزبور والقرآن","الإنجيل والقرآن","التوراة والزبور"],"answer":0,"explanation":"تذكر الآية تعليم عيسى الكتاب والحكمة والتوراة والإنجيل.","source":{"title":"القرآن الكريم","url":"https://quran.com/3/48","reference":"سورة آل عمران، الآية 48"},"spoiler":false,"tags":["عيسى عليه السلام","قرآن"],"version":1,"hint":"أحدهما الكتاب المرتبط برسالته."},{"id":"prophets-038","category":"prophets","sub":"عيسى عليه السلام","level":3,"q":"ما المادة التي كان عيسى يصنع منها كهيئة الطير فيكون طيرًا بإذن الله؟","options":["الطين","الخشب","النحاس","الزجاج"],"answer":0,"explanation":"تذكر آية آل عمران 49 الطين، وتؤكد أن وقوع هذه الآية بإذن الله.","source":{"title":"القرآن الكريم","url":"https://quran.com/3/49","reference":"سورة آل عمران، الآية 49"},"spoiler":false,"tags":["عيسى عليه السلام","قرآن"],"version":1,"hint":"مادة تُشكّل بعد خلط التراب بالماء."},{"id":"prophets-039","category":"prophets","sub":"زكريا ويحيى عليهما السلام","level":2,"q":"ما اسم الغلام الذي بُشّر به زكريا عليه السلام في سورة مريم؟","options":["يحيى","إسماعيل","إدريس","إلياس"],"answer":0,"explanation":"بشّر الله زكريا بغلام اسمه يحيى في سورة مريم.","source":{"title":"القرآن الكريم","url":"https://quran.com/19/7","reference":"سورة مريم، الآية 7"},"spoiler":false,"tags":["زكريا ويحيى عليهما السلام","قرآن"],"version":1,"hint":"وردت البشارة بتسميته صراحة."},{"id":"prophets-040","category":"prophets","sub":"زكريا ويحيى عليهما السلام","level":4,"q":"كم يومًا كانت آية زكريا ألا يكلم الناس إلا رمزًا بحسب سورة آل عمران؟","options":["3 أيام","7 أيام","10 أيام","40 يومًا"],"answer":0,"explanation":"تحدد سورة آل عمران الآية بثلاثة أيام لا يكلم الناس فيها إلا رمزًا، مع الأمر بكثرة الذكر.","source":{"title":"القرآن الكريم","url":"https://quran.com/3/41","reference":"سورة آل عمران، الآية 41"},"spoiler":false,"tags":["زكريا ويحيى عليهما السلام","قرآن"],"version":1,"hint":"عدد أقل من 4."},{"id":"prophets-041","category":"prophets","sub":"هود عليه السلام","level":1,"q":"إلى أي قوم أُرسل هود عليه السلام؟","options":["عاد","ثمود","مدين","أصحاب القرية"],"answer":0,"explanation":"تذكر سورة الأعراف إرسال هود إلى عاد ودعوته إياهم إلى عبادة الله.","source":{"title":"القرآن الكريم","url":"https://quran.com/7/65","reference":"سورة الأعراف، الآية 65"},"spoiler":false,"tags":["هود عليه السلام","قرآن"],"version":1,"hint":"قوم ذُكروا مع إرم في سورة الفجر."},{"id":"prophets-042","category":"prophets","sub":"صالح عليه السلام","level":1,"q":"ما الآية التي جاء بها صالح عليه السلام إلى ثمود والمذكورة في سورة الأعراف؟","options":["الناقة","العصا","المائدة","الريح"],"answer":0,"explanation":"تذكر آية الأعراف 73 ناقة الله آية لثمود وتنهى عن مسها بسوء.","source":{"title":"القرآن الكريم","url":"https://quran.com/7/73","reference":"سورة الأعراف، الآية 73"},"spoiler":false,"tags":["صالح عليه السلام","قرآن"],"version":1,"hint":"حيوان من الإبل."},{"id":"prophets-043","category":"prophets","sub":"شعيب عليه السلام","level":2,"q":"أي مخالفة نهى شعيب قومه عنها في شأن البيع والشراء؟","options":["نقص الكيل والميزان","زراعة النخيل","صناعة السفن","جمع الحطب"],"answer":0,"explanation":"دعا شعيب أهل مدين إلى إيفاء الكيل والميزان وعدم بخس الناس أشياءهم.","source":{"title":"القرآن الكريم","url":"https://quran.com/7/85","reference":"سورة الأعراف، الآية 85"},"spoiler":false,"tags":["شعيب عليه السلام","قرآن"],"version":1,"hint":"تتعلق بحق المشتري في مقدار ما يدفع ثمنه."},{"id":"prophets-044","category":"prophets","sub":"أيوب عليه السلام","level":2,"q":"أي نبي دعا ربه بعد أن مسه الضر وذكر أنه أرحم الراحمين؟","options":["أيوب عليه السلام","سليمان عليه السلام","هارون عليه السلام","لوط عليه السلام"],"answer":0,"explanation":"تذكر سورة الأنبياء دعاء أيوب حين مسه الضر، ثم استجابة الله له في الآية التالية.","source":{"title":"القرآن الكريم","url":"https://quran.com/21/83","reference":"سورة الأنبياء، الآية 83"},"spoiler":false,"tags":["أيوب عليه السلام","قرآن"],"version":1,"hint":"اشتهرت قصته بالصبر على البلاء."},{"id":"prophets-045","category":"prophets","sub":"إدريس عليه السلام","level":3,"q":"أي نبي تصفه سورة مريم بأنه صديق نبي، ثم تذكر رفعه مكانًا عليًا؟","options":["إدريس عليه السلام","يونس عليه السلام","شعيب عليه السلام","صالح عليه السلام"],"answer":0,"explanation":"تصف مريم 56 إدريس بأنه صديق نبي، وتذكر الآية 57 رفعه مكانًا عليًا.","source":{"title":"القرآن الكريم","url":"https://quran.com/19/56","reference":"سورة مريم، الآية 56"},"spoiler":false,"tags":["إدريس عليه السلام","قرآن"],"version":1,"hint":"اسمه في الخيارات يبدأ بهمزة."},{"id":"prophets-046","category":"prophets","sub":"نوح عليه السلام","level":3,"q":"كيف وصف نوح عليه السلام أوقات دعوته لقومه في سورة نوح؟","options":["ليلًا ونهارًا","في الأعياد فقط","مرة في العام","عند السفر فقط"],"answer":0,"explanation":"ذكر نوح أنه دعا قومه ليلًا ونهارًا، دلالة على استمراره في دعوتهم.","source":{"title":"القرآن الكريم","url":"https://quran.com/71/5","reference":"سورة نوح، الآية 5"},"spoiler":false,"tags":["نوح عليه السلام","قرآن"],"version":1,"hint":"تعبير يجمع وقتين متقابلين."},{"id":"prophets-047","category":"prophets","sub":"يوسف عليه السلام","level":3,"q":"ماذا كان موقف يوسف عليه السلام من إخوته عندما قال: لا تثريب عليكم اليوم؟","options":["العفو عنهم","إعادتهم إلى السجن","منعهم من الطعام","إجبارهم على الرحيل فورًا"],"answer":0,"explanation":"نفى يوسف التثريب عن إخوته ودعا لهم بالمغفرة، وهو موقف عفو وصفح.","source":{"title":"القرآن الكريم","url":"https://quran.com/12/92","reference":"سورة يوسف، الآية 92"},"spoiler":false,"tags":["يوسف عليه السلام","قرآن"],"version":1,"hint":"نفى اللوم ودعا بالمغفرة."},{"id":"prophets-048","category":"prophets","sub":"موسى عليه السلام","level":4,"q":"ما الذي نسيه موسى وفتاه عند مجمع البحرين في سورة الكهف؟","options":["الحوت","العصا","القميص","الزاد كله"],"answer":0,"explanation":"تذكر سورة الكهف أنهما نسيا حوتهما فاتخذ سبيله في البحر.","source":{"title":"القرآن الكريم","url":"https://quran.com/18/61","reference":"سورة الكهف، الآية 61"},"spoiler":false,"tags":["موسى عليه السلام","قرآن"],"version":1,"hint":"شيء من طعامهما يتعلق بالبحر."},{"id":"prophets-049","category":"prophets","sub":"زكريا ويحيى عليهما السلام","level":3,"q":"ماذا تذكر سورة مريم أن الله آتاه ليحيى وهو صبي؟","options":["الحكم","الملك على مصر","تسخير الريح","صناعة الدروع"],"answer":0,"explanation":"ورد في مريم 12 أن الله آتى يحيى الحكم صبيًا؛ والسؤال يلتزم لفظ الآية.","source":{"title":"القرآن الكريم","url":"https://quran.com/19/12","reference":"سورة مريم، الآية 12"},"spoiler":false,"tags":["زكريا ويحيى عليهما السلام","قرآن"],"version":1,"hint":"يتعلق بالفهم والعلم والحكمة."},{"id":"prophets-050","category":"prophets","sub":"سليمان عليه السلام","level":4,"q":"ما القوة الطبيعية المسخرة لسليمان التي كان غدوها شهرًا ورواحها شهرًا؟","options":["الريح","المطر","البرق","المد والجزر"],"answer":0,"explanation":"تذكر سورة سبأ تسخير الريح لسليمان بهذه الصفة.","source":{"title":"القرآن الكريم","url":"https://quran.com/34/12","reference":"سورة سبإ، الآية 12"},"spoiler":false,"tags":["سليمان عليه السلام","قرآن"],"version":1,"hint":"تتصل بحركة الهواء."},{"id":"seerah-001","category":"seerah","sub":"المولد والنسب","level":1,"q":"في أي يوم من الأسبوع وُلد النبي محمد ﷺ وفق حديث صحيح مسلم؟","options":["الاثنين","الجمعة","السبت","الأربعاء"],"answer":0,"explanation":"ذكر النبي ﷺ عند سؤاله عن صوم الاثنين أنه يوم وُلد فيه. والسؤال لا يفترض تاريخًا مختلفًا فيه من الشهر.","source":{"title":"صحيح مسلم","url":"https://sunnah.com/muslim:1162b","reference":"صحيح مسلم، حديث 1162b"},"spoiler":false,"tags":["المولد والنسب","حديث صحيح"],"version":1,"hint":"هو اليوم الذي ورد استحباب صيامه في الحديث."},{"id":"seerah-002","category":"seerah","sub":"المولد والنسب","level":2,"q":"من أي بطن من قريش كان النبي محمد ﷺ؟","options":["بني هاشم","بني مخزوم","بني أمية","بني سهم"],"answer":0,"explanation":"جاء في صحيح مسلم اصطفاء بني هاشم من قريش، واصطفاء النبي ﷺ من بني هاشم.","source":{"title":"صحيح مسلم","url":"https://sunnah.com/muslim:2276","reference":"صحيح مسلم، حديث 2276"},"spoiler":false,"tags":["المولد والنسب","حديث صحيح"],"version":1,"hint":"اسم البطن مرتبط باسم جد من أجداده."},{"id":"seerah-003","category":"seerah","sub":"بدء الوحي","level":3,"q":"بماذا بدأ الوحي إلى النبي ﷺ بحسب حديث عائشة في أول صحيح البخاري؟","options":["الرؤيا الصالحة","نزول كتاب كامل دفعة واحدة","كتابة ألواح من حجر","رؤية النار في واد"],"answer":0,"explanation":"تذكر عائشة أن بدء الوحي كان بالرؤيا الصالحة في النوم.","source":{"title":"صحيح البخاري","url":"https://sunnah.com/bukhari:3","reference":"صحيح البخاري، حديث 3"},"spoiler":false,"tags":["بدء الوحي","حديث صحيح"],"version":1,"hint":"وقع ذلك في النوم."},{"id":"seerah-004","category":"seerah","sub":"بدء الوحي","level":1,"q":"في أي غار نزل الوحي أول مرة على النبي ﷺ؟","options":["حراء","ثور","أصحاب الكهف","نقب"],"answer":0,"explanation":"يذكر حديث بدء الوحي أن النبي ﷺ كان في غار حراء حين جاءه الملك.","source":{"title":"صحيح البخاري","url":"https://sunnah.com/bukhari:3","reference":"صحيح البخاري، حديث 3"},"spoiler":false,"tags":["بدء الوحي","حديث صحيح"],"version":1,"hint":"لا تخلطه بالغار المرتبط بالهجرة."},{"id":"seerah-005","category":"seerah","sub":"بدء الوحي","level":1,"q":"إلى من عاد النبي ﷺ بعد نزول الوحي أول مرة وهو يقول: زملوني؟","options":["خديجة رضي الله عنها","عائشة رضي الله عنها","حفصة رضي الله عنها","أم سلمة رضي الله عنها"],"answer":0,"explanation":"عاد إلى خديجة فطمأنته وذكرت ما عُرف به من صلة الرحم ومساعدة المحتاج.","source":{"title":"صحيح البخاري","url":"https://sunnah.com/bukhari:3","reference":"صحيح البخاري، حديث 3"},"spoiler":false,"tags":["بدء الوحي","حديث صحيح"],"version":1,"hint":"كانت زوجته في بداية البعثة."},{"id":"seerah-006","category":"seerah","sub":"بدء الوحي","level":2,"q":"من الذي اصطحبت خديجة النبي ﷺ إليه بعد بدء الوحي؟","options":["ورقة بن نوفل","أبو سفيان","سهيل بن عمرو","عمرو بن هشام"],"answer":0,"explanation":"اصطحبته خديجة إلى ابن عمها ورقة بن نوفل، كما تروي عائشة في حديث بدء الوحي.","source":{"title":"صحيح البخاري","url":"https://sunnah.com/bukhari:3","reference":"صحيح البخاري، حديث 3"},"spoiler":false,"tags":["بدء الوحي","حديث صحيح"],"version":1,"hint":"كان قريبًا لخديجة وعلى علم بكتب سابقة."},{"id":"seerah-007","category":"seerah","sub":"بدء الوحي","level":1,"q":"ما السورة التي نزلت أوائل آياتها في غار حراء وفق حديث بدء الوحي؟","options":["العلق","الفاتحة","الكوثر","النصر"],"answer":0,"explanation":"يروي الحديث نزول الآيات الأولى التي تبدأ بالأمر بالقراءة من سورة العلق.","source":{"title":"صحيح البخاري","url":"https://sunnah.com/bukhari:3","reference":"صحيح البخاري، حديث 3"},"spoiler":false,"tags":["بدء الوحي","حديث صحيح"],"version":1,"hint":"اسمها يتعلق بمرحلة من خلق الإنسان."},{"id":"seerah-008","category":"seerah","sub":"العهد المكي","level":1,"q":"كم كان عمر النبي ﷺ عند بعثته بحسب رواية ابن عباس في صحيح البخاري؟","options":["40 سنة","25 سنة","50 سنة","63 سنة"],"answer":0,"explanation":"تحدد رواية ابن عباس عمره عند البعثة بأربعين سنة.","source":{"title":"صحيح البخاري","url":"https://sunnah.com/bukhari:3902","reference":"صحيح البخاري، حديث 3902"},"spoiler":false,"tags":["العهد المكي","حديث صحيح"],"version":1,"hint":"أربعة عقود."},{"id":"seerah-009","category":"seerah","sub":"العهد المكي","level":3,"q":"كم عامًا مكث النبي ﷺ بمكة يُوحى إليه قبل الهجرة وفق رواية ابن عباس؟","options":["13 عامًا","10 أعوام","7 أعوام","20 عامًا"],"answer":0,"explanation":"تذكر الرواية 13 عامًا بمكة بعد البعثة وقبل الهجرة.","source":{"title":"صحيح البخاري","url":"https://sunnah.com/bukhari:3902","reference":"صحيح البخاري، حديث 3902"},"spoiler":false,"tags":["العهد المكي","حديث صحيح"],"version":1,"hint":"أكثر من عقد بثلاث سنوات."},{"id":"seerah-010","category":"seerah","sub":"الإسراء والمعراج","level":1,"q":"إلى أي مسجد كان الإسراء من المسجد الحرام كما تنص سورة الإسراء؟","options":["المسجد الأقصى","المسجد النبوي","مسجد قباء","مسجد القبلتين"],"answer":0,"explanation":"تذكر الآية الأولى من سورة الإسراء الانتقال ليلًا من المسجد الحرام إلى المسجد الأقصى.","source":{"title":"القرآن الكريم","url":"https://quran.com/17/1","reference":"سورة الإسراء، الآية 1"},"spoiler":false,"tags":["الإسراء والمعراج","قرآن"],"version":1,"hint":"يقع في القدس."},{"id":"seerah-011","category":"seerah","sub":"الإسراء والمعراج","level":2,"q":"ما اسم الدابة التي ركبها النبي ﷺ في رحلة الإسراء كما ورد في الحديث؟","options":["البراق","القصواء","دلدل","اليعفور"],"answer":0,"explanation":"ورد ذكر البراق في حديث المعراج، ووُصفت بأنها دابة بيضاء.","source":{"title":"صحيح البخاري","url":"https://sunnah.com/bukhari:3887","reference":"صحيح البخاري، حديث 3887"},"spoiler":false,"tags":["الإسراء والمعراج","حديث صحيح"],"version":1,"hint":"اسمها مرتبط لغويًا بالبرق."},{"id":"seerah-012","category":"seerah","sub":"الإسراء والمعراج","level":2,"q":"من الملك الذي رافق النبي ﷺ في صعوده في حديث المعراج؟","options":["جبريل عليه السلام","ميكائيل عليه السلام","إسرافيل عليه السلام","مالك عليه السلام"],"answer":0,"explanation":"تذكر رواية المعراج أن جبريل كان يرافق النبي ﷺ ويستفتح أبواب السماوات.","source":{"title":"صحيح البخاري","url":"https://sunnah.com/bukhari:3887","reference":"صحيح البخاري، حديث 3887"},"spoiler":false,"tags":["الإسراء والمعراج","حديث صحيح"],"version":1,"hint":"هو الملك المرتبط بنزول الوحي."},{"id":"seerah-013","category":"seerah","sub":"الإسراء والمعراج","level":1,"q":"إلى كم صلاة في اليوم والليلة انتهى فرض الصلاة في حديث المعراج؟","options":["5 صلوات","3 صلوات","10 صلوات","50 صلاة"],"answer":0,"explanation":"انتهى فرض الصلاة إلى خمس صلوات في اليوم والليلة بعد التخفيف المذكور في الحديث.","source":{"title":"صحيح البخاري","url":"https://sunnah.com/bukhari:3887","reference":"صحيح البخاري، حديث 3887"},"spoiler":false,"tags":["الإسراء والمعراج","حديث صحيح"],"version":1,"hint":"العدد هو عدد الصلوات المفروضة يوميًا."},{"id":"seerah-014","category":"seerah","sub":"الهجرة","level":1,"q":"من رافق النبي ﷺ في الهجرة من مكة إلى المدينة؟","options":["أبو بكر الصديق رضي الله عنه","عمر بن الخطاب رضي الله عنه","عثمان بن عفان رضي الله عنه","حمزة بن عبد المطلب رضي الله عنه"],"answer":0,"explanation":"تروي عائشة خروج النبي ﷺ وأبي بكر معًا في الهجرة.","source":{"title":"صحيح البخاري","url":"https://sunnah.com/bukhari function resolveQuestion(correct,outcome){const s=session,c=s.current;if(c.phase!=='answer')return;clearInterval(timerHandle);c.remainingMs=c.deadline?Math.max(0,c.deadline-Date.now()):c.remainingMs;c.deadline=null;c.phase='feedback';c.correct=correct;c.outcome=outcome;const p=s.players[s.turn],q=QUESTION_MAP.get(c.id);p.answered++;p.streak=correct?p.streak+1:0;if(correct)p.correct++;if(!correct&&outcome!=='skip'&&s.mode==='survival')p.lives=Math.max(0,p.lives-1);const bonus=correct?Math.min(250,Math.floor((p.streak-1)/2)*50):0;c.earned=correct&&s.mode!=='practice'?(c.base+bonus)*(c.double?2:1):0;p.score+=c.earned;
s.results.push({id:q.id,correct,points:c.earned,player:s.turn});if(c.tile){const tile=s.board.find(t=>t.key===c.tile);if(tile)tile.done=true;}
if(correct)progress.solved[q.id]=true;progress.answers++;progress.correct+=Number(correct);progress.points+=c.earned;progress.xp+=correct?(s.mode==='practice'?5:10+q.level*5):2;progress.bestStreak=Math.max(progress.bestStreak,p.streak);if(correct&&q.image?.startsWith('flag-'))progress.imageCorrect++;const stats=progress.category[q.category]||(progress.category[q.category]={answered:0,correct:0});stats.answered++;stats.correct+=Number(correct);progress.seen[q.id]=Date.now();progress.history.unshift({id:q.id,correct,at:Date.now()});progress.history=progress.history.slice(0,100);sound(correct?'correct':'wrong');if(correct&&p.streak%3===0)confetti();try{if(prefs.sound&&navigator.vibrate)navigator.vibrate(correct?25:[35,35,35]);}catch{}checkAchievements();persist();render();$('#main [data-action=next]')?.focus({preventScroll:true});$('#announcer').textContent=correct?`إجابة صحيحة. حصلت على ${c.earned} نقطة.`:`الإجابة الصحيحة: ${q.options[q.answer]}`;}
function helper(id){const s=session,c=s?.current;if(!c||c.phase!=='answer'||c.paused)return;if(c.timed&&c.deadline&&Date.now()>=c.deadline){commitAnswer(null,'timeout');return;}const bag=s.bags[s.turn],q=QUESTION_MAP.get(c.id);if(!bag[id]||c.used.includes(id))return;if(id==='time'&&!c.timed||id==='fifty'&&c.format!=='choice'||id==='double'&&s.mode==='practice')return;
if(id==='fifty'){const wrong=shuffled(c.order.filter(x=>x!==q.answer&&!c.eliminated.includes(x)));c.eliminated.push(...wrong.slice(0,Math.min(2,wrong.length)));}if(id==='time'){c.deadline+=15000;c.remainingMs+=15000;}if(id==='hint')c.hint=true;if(id==='second')c.second=true;if(id==='double')c.double=true;bag[id]--;c.used.push(id);if(id==='skip'){resolveQuestion(false,'skip');return;}persist();render();}
function goNext(){if(!session||session.current?.phase!=='feedback')return;session.current=null;if(session.results.length>=session.target||session.mode==='survival'&&session.players[0].lives<=0){finishGame();return;}session.turn=(session.turn+1)%session.players.length;if(session.players.length>1)session.handoff=true;else if(session.mode!=='classic')nextQuestion();persist();render();$('#question-title')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function finishGame(){const s=session;if(!s)return;s.status='done';s.current=null;if(!s.finished){s.finished=true;progress.games++;const first=s.players[0],win=s.players.length>1?first.score===Math.max(...s.players.map(p=>p.score)):first.correct/Math.max(1,first.answered)>=.6;if(s.mode!=='practice'){if(win)progress.wins++;else progress.losses++;}const total=s.players.reduce((sum,p)=>sum+p.score,0);progress.records[s.mode]=Math.max(progress.records[s.mode]||0,total);if(s.mode==='daily')progress.daily[s.date]={completed:true,score:total};checkAchievements();persist();confetti();}route='result';render();}
function renderResult(){if(!session)return renderHome();const s=session,sorted=[...s.players].sort((a,b)=>b.score-a.score),total=s.players.reduce((sum,p)=>sum+p.score,0),correct=s.results.filter(r=>r.correct).length,accuracy=Math.round(correct/Math.max(1,s.results.length)*100);return `<div class="result-hero panel"><span class="eyebrow">${modeById(s.mode).name} · اكتملت الجولة</span><div class="result-trophy">${icon('cup')}</div><h1>${s.players.length>1?(sorted.filter(p=>p.score===sorted[0].score).length>1?'تعادل جميل… وتحدٍ أجمل!':`الصدارة لـ ${esc(sorted[0].name)}`):accuracy>=60?'تألّقت معرفتك!':'كل جولة تزيدك معرفة'}</h1><div class="result-score">${num(total)} <small>نقطة</small></div><p class="muted">${correct} إجابة صحيحة من ${s.results.length} · دقة ${accuracy}%</p><div class="hero-actions"><button class="btn primary" data-action="replay">جولة جديدة ${icon('play')}</button><button class="btn secondary" data-action="nav" data-route="home">الرئيسية ${icon('home')}</button></div></div>${s.players.length>1?`<div class="panel stack"><h2>ترتيب الأصدقاء</h2>${sorted.map((p,i)=>`<div class="leaderboard-row"><span class="rank">${i+1}</span><strong>${esc(p.name)}</strong><span>${num(p.score)} نقطة · ${p.correct}/${p.answered} صحيحة</span></div>`).join('')}</div>`:''}<div class="section-heading"><h2>حصيلة المعرفة</h2><span class="muted">راجع التفسيرات والمصادر</span></div><div class="stack">${s.results.map((r,i)=>{const q=QUESTION_MAP.get(r.id);return `<details class="panel review-item"><summary><span class="review-status ${r.correct?'correct':'wrong'}">${icon(r.correct?'check':'close')}</span><span>${i+1}. ${esc(q.q)}</span><span class="muted">+${r.points}</span></summary><div><p><strong>${esc(q.options[q.answer])}</strong></p><p>${esc(q.explanation)}</p><p class="muted">${esc(q.source.title)} · ${esc(q.source.reference)}</p><a class="source-link" href="${esc(safeURL(q.source.url))}" target="_blank" rel="noopener noreferrer">فتح المرجع</a></div></details>`;}).join('')}</div>`;}
function renderProfile(){const li=levelInfo();return `${title('حكاية تقدّمك','ملف اللاعب','كل إجابة تضيف خطوة إلى رحلتك. يُحفظ التقدم على هذا المتصفح والجهاز.')}<section class="profile-hero panel"><span class="big-avatar">${progress.profile.avatar}</span><div><span class="eyebrow">المستوى ${li.level}</span><h2>${esc(progress.profile.name)}</h2><p class="muted">${num(progress.xp)} خبرة · ${num(li.left)} للمستوى التالي</p><div class="meter"><span style="width:${li.percent}%"></span></div></div><button class="btn secondary" data-action="nav" data-route="settings">تعديل الملف ${icon('user')}</button></section><div class="stats-grid">${stat('cup',num(progress.games),'الجولات المكتملة')}${stat('check',`${progress.correct}/${progress.answers}`,'الإجابات الصحيحة')}${stat('bolt',num(progress.bestStreak),'أفضل سلسلة')}${stat('star',num(progress.points),'إجمالي النقاط')}</div><div class="panel row"><span>انتصارات: <strong>${progress.wins}</strong></span><span>خسائر: <strong>${progress.losses}</strong></span><small class="muted">الفردي: دقة 60% للفوز. المتعدد: صدارة اللاعب الأول. التدريب مستثنى.</small></div><div class="section-heading"><h2>أوسمة تستحقها</h2><span class="muted">${progress.achievements.length} من ${ACHIEVEMENTS.length}</span></div><div class="achievement-grid">${ACHIEVEMENTS.map(a=>`<div class="achievement-card ${progress.achievements.includes(a.id)?'':'locked'}"><span class="mode-icon">${icon(a.icon)}</span><h3>${a.name}</h3><p>${a.desc}</p><span class="badge">${progress.achievements.includes(a.id)?'تم الإنجاز':'قيد التقدم'}</span></div>`).join('')}</div><div class="section-heading"><h2>بصمتك في كل فئة</h2><button class="text-btn" data-action="nav" data-route="history">سجل الأسئلة ${icon('history')}</button></div><div class="grid-2">${CATEGORIES.map(c=>{const st=progress.category[c.id]||{answered:0,correct:0},mastery=Math.min(100,Math.round(QUESTION_BANK.filter(q=>q.category===c.id&&progress.solved[q.id]).length/QUESTION_BANK.filter(q=>q.category===c.id).length*100));return `<div class="panel mastery-card"><div class="row"><span class="stat-icon" style="color:${c.color}">${icon(c.icon)}</span><h3>${c.name}</h3><strong>${mastery}%</strong></div><div class="meter"><span style="width:${mastery}%;background:${c.color}"></span></div><p class="muted">${st.correct} صحيحة من ${st.answered} محاولة · الإتقان يقيس الأسئلة المختلفة التي أجبت عنها بشكل صحيح</p></div>`;}).join('')}</div><div class="section-heading"><h2>أرقامك القياسية</h2></div><div class="grid-3">${[...MODES,modeById('daily')].filter(m=>progress.records[m.id]!==undefined).map(m=>`<div class="panel"><h3>${m.name}</h3><strong class="record-number">${num(progress.records[m.id])}</strong><small class="muted"> نقطة · مجموع الجولة لكل اللاعبين</small></div>`).join('')||'<p class="muted">أكمل جولتك الأولى لتبدأ سجل أرقامك.</p>'}</div>`;}

function openDialog(heading,body,actions=''){lastFocus=document.activeElement;const d=$('#dialog');d.innerHTML=`<div class="modal"><div class="dialog-head"><h2>${heading}</h2><button class="icon-btn" data-action="close-dialog" aria-label="إغلاق">${icon('close')}</button></div><div class="dialog-body">${body}</div>${actions?`<div class="dialog-actions">${actions}</div>`:''}</div>`;if(!d.open)d.showModal();d.querySelector('button, input')?.focus();}
function closeDialog(){if(storageConflict)return;const d=$('#dialog');if(d.open)d.close();lastFocus?.focus?.();}
function showHelp(){pauseSession();if(route==='play')render();openDialog('دليل اللعب',`<div class="stack"><p>اختر نمط اللعب والفئات، ثم اعتمد إجابتك. يظهر التفسير والمصدر بعد الإجابة. لا تتكرر الأسئلة داخل الجولة، وتُفضَّل الأسئلة التي لم تجب عنها في الجولات الجديدة.</p><p><strong>النقاط:</strong> 100 × مستوى الصعوبة، أو قيمة خانة اللوحة. كل إجابتين متتاليتين بعد الأولى تضيفان 50 نقطة، بحد 250. مضاعفة النقاط تضاعف المجموع. التدريب دون نقاط؛ الإجابة الصحيحة فيه تمنح 5 خبرة.</p><p><strong>الحفظ:</strong> يُحفظ كل جواب تلقائيًا. العودة للرئيسية أو إخفاء الصفحة يوقفان مؤقّت السؤال. استأنف من بطاقة الجولة المحفوظة.</p><p><strong>التحدي اليومي:</strong> 10 أسئلة تتحدد بتاريخ الجهاز المحلي عند بدء الجولة. يبقى تاريخ الجولة ثابتًا حتى لو أكملتها بعد منتصف الليل، ولا تُمسح الأيام السابقة.</p><p><strong>المتعدد:</strong> التناوب على الجهاز نفسه، مع مساعدات مستقلة لكل لاعب. الإحصاءات في الملف تجمع محاولات جميع المشاركين.</p><p><strong>المفاتيح:</strong> الأرقام 1 إلى 4 للاختيارات، Enter للسؤال التالي بعد الكشف، وEscape لإيقاف السؤال. التنقل بـTab والاعتماد بـEnter أو المسافة.</p><p><strong>الإجابات الكتابية:</strong> تطابق الاسم الكامل بعد إزالة التشكيل وتوحيد الهمزات والمسافات. لا تستخدم تخمينًا لغويًا أو خدمة ذكاء اصطناعي.</p><p>تحدي الصور في هذا الإصدار مخصّص للأعلام. لا يتضمن صور شخصيات أنمي أو لاعبين أو شعارات أندية مرخّصة حتى الآن.</p></div>`);}

async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('الشاشة الكاملة غير متاحة هنا. يمكنك اللعب بالعرض الحالي.');}catch{toast('تعذّر تفعيل ملء الشاشة. اللعبة متاحة بالعرض الحالي.');}}
function exportProgress(){pauseSession();persist();const blob=new Blob([JSON.stringify({version:1,prefs,progress},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`seen-khaled-${localDate()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('أُعدّت نسخة تقدمك للتنزيل.');}
async function importFile(file){if(!file)return;try{if(file.size>1500000)throw Error('ملف الحفظ أكبر من الحجم المسموح.');const text=await file.text();const raw=JSON.parse(text,(key,value)=>{if(['__proto__','constructor','prototype'].includes(key))throw Error('ملف الحفظ يحتوي على مفاتيح غير مسموحة.');return value;});const checked=validateSave(raw);openDialog('استبدال التقدم المحفوظ؟',`<p>الملف باسم <strong>${esc(checked.progress.profile.name)}</strong> ويحتوي على ${checked.progress.answers} محاولة و${checked.progress.games} جولات. سيحل محل تقدمك الحالي والجولة الجارية.</p>`,`<button class="btn primary" id="confirm-import">استيراد النسخة</button><button class="btn secondary" data-action="close-dialog">إلغاء</button>`);$('#confirm-import').addEventListener('click',()=>{progress=checked.progress;prefs=checked.prefs;session=null;applyPrefs();persist();closeDialog();navigate('profile');toast('تم استيراد تقدمك بنجاح.');},{once:true});}catch(e){toast(e instanceof SyntaxError?'تعذّرت قراءة الملف. اختر ملف حفظ صالحًا.':/[\u0600-\u06ff]/.test(e.message)?e.message:'تعذّر استيراد الحفظ. الملف غير صالح.');}finally{$('#import-file').value='';}}
function requestStart(mode,daily=false){if(session?.status==='active'){pauseSession();openDialog('لديك جولة محفوظة',`<p>بدء جولة جديدة سيستبدل الجولة الجارية. تبقى إجاباتك السابقة وخبرتك محفوظتين.</p>`,`<button class="btn primary" id="confirm-start">بدء جولة جديدة</button><button class="btn secondary" data-action="resume-dialog">متابعة المحفوظة</button>`);$('#confirm-start').addEventListener('click',()=>{closeDialog();startGame(mode,daily);},{once:true});}else startGame(mode,daily);}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;if(b.dataset.action==='reload'){window.location.reload();return;}if(storageConflict)return;unlockAudio();sound('click');const action=b.dataset.action;
if(action==='nav')navigate(b.dataset.route);
else if(action==='setup')makeSetup(b.dataset.mode);
else if(action==='browse-category')makeSetup('solo',[b.dataset.id]);
else if(action==='toggle-category'){const id=b.dataset.id;if(setup.cats.includes(id))setup.cats=setup.cats.filter(x=>x!==id);else setup.cats.push(id);render();}
else if(action==='start')requestStart(setup.mode);
else if(action==='daily'){if(progress.daily[localDate()]?.completed)return;if(session?.status==='active'&&session.mode==='daily'&&session.date===localDate()){resumeGame();return;}setup={mode:'daily',players:1,names:[progress.profile.name],cats:CATEGORIES.map(c=>c.id),format:'choice',series:'all'};requestStart('daily',true);}
else if(action==='resume')resumeGame();
else if(action==='resume-dialog'){closeDialog();resumeGame();}
else if(action==='ready'){session.handoff=false;if(session.mode!=='classic')nextQuestion();persist();render();}
else if(action==='tile'){const tile=session?.board.find(t=>t.key===b.dataset.key);if(tile&&!tile.done&&!session.current){nextQuestion(tile);render();window.scrollTo(0,0);}}
else if(action==='answer')commitAnswer(Number(b.dataset.index));
else if(action==='next')goNext();
else if(action==='helper')helper(b.dataset.helper);
else if(action==='pause'){pauseSession();render();}
else if(action==='unpause')resumeQuestion();
else if(action==='close-dialog')closeDialog();
else if(action==='helper-rules'){pauseSession();render();openDialog('قواعد المساعدات',`<div class="stack">${HELPERS.map(h=>`<p><strong>${h.name}:</strong> ${h.desc}</p>`).join('')}<p class="muted">المساعدات تتجدد في كل جولة. لكل لاعب في التحديات المحلية رصيد مستقل. فتح الدليل يوقف السؤال، وتحتاج إلى استئنافه بعد الإغلاق.</p></div>`);}
else if(action==='zoom'){const img=VISUALS[b.dataset.image];if(img){pauseSession();render();openDialog('الصورة بحجم أكبر',`<img class="zoom-image" src="${imageSrc(b.dataset.image)}" alt="${esc(img.alt)}"><p class="muted">${esc(img.credit)} · ${img.license}</p>`);}}
else if(action==='enable-images'){prefs.images=true;applyPrefs();persist();render();}
else if(action==='theme'){prefs.theme=prefs.theme==='dark'?'light':'dark';applyPrefs();persist();render();}
else if(action==='fullscreen')fullscreen();
else if(action==='avatar'){progress.profile.avatar=b.dataset.value;persist();render();}
else if(action==='favorite'){const id=b.dataset.id;progress.profile.favorites=progress.profile.favorites.includes(id)?progress.profile.favorites.filter(x=>x!==id):[...progress.profile.favorites,id];persist();render();}
else if(action==='test-sound'){sound('correct');ambient();}
else if(action==='help')showHelp();
else if(action==='about')showAbout();
else if(action==='export')exportProgress();
else if(action==='import'){$('#import-file').click();}
else if(action==='reset'){pauseSession();openDialog('تصفير التقدم؟','<p>ستُحذف الإحصاءات والإنجازات والجولة المحفوظة من هذا المتصفح. يمكنك تصدير نسخة قبل المتابعة. يبقى المظهر والصوت كما اخترتهما.</p>','<button class="btn danger" id="confirm-reset">نعم، احذف التقدم</button><button class="btn secondary" data-action="close-dialog">إلغاء</button>');$('#confirm-reset').addEventListener('click',()=>{progress=freshProgress();session=null;persist();closeDialog();navigate('home');toast('تم تصفير التقدم.');},{once:true});}
else if(action==='replay'){if(session.mode==='daily'){toast('اكتمل تحدي اليوم. جرّب التدريب أو عد غدًا.');makeSetup('practice',session.cats);}else makeSetup(session.mode,session.cats);}
});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-pref]')){const k=t.dataset.pref;if(k==='accent'&&t.value==='gold'&&progress.xp<400)return;prefs[k]=t.type==='checkbox'?t.checked:['sound','music','duration','textSize'].includes(k)?Number(t.value):t.value;applyPrefs();persist();unlockAudio();render();}else if(t.matches('[data-profile]')){progress.profile.name=cleanName(t.value);persist();shell();t.value=progress.profile.name;}else if(t.matches('[data-setup]')){setup[t.dataset.setup]=t.dataset.setup==='players'?Number(t.value):t.value;render();}else if(t.matches('[data-player]'))setup.names[Number(t.dataset.player)]=cleanName(t.value,`اللاعب ${Number(t.dataset.player)+1}`);else if(t.id==='import-file')importFile(t.files[0]);});
document.addEventListener('submit',e=>{if(e.target.id==='text-answer'){e.preventDefault();commitAnswer(new FormData(e.target).get('answer'));}});
document.addEventListener('keydown',e=>{if($('#dialog').open||e.target.matches('input,textarea,select'))return;if(route==='play'&&session?.current){const c=session.current;if(e.key==='Escape'&&c.phase==='answer'){e.preventDefault();pauseSession();render();}else if(e.key==='Enter'&&c.phase==='feedback'&&!e.target.closest('button,a,summary')){e.preventDefault();goNext();}else if(/^[1-4]$/.test(e.key)&&c.phase==='answer'&&!c.paused&&c.format!=='text'){const idx=Number(e.key)-1,order=c.format==='boolean'?[1,0]:c.order;if(idx<order.length){e.preventDefault();unlockAudio();commitAnswer(order[idx]);}}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseSession();stopMusic();if(route==='play')render();}else if(audioContext?.state==='running'&&prefs.music){ambient();musicHandle=setInterval(ambient,6000);}});
window.addEventListener('pagehide',pauseSession);window.addEventListener('beforeunload',pauseSession);
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY&&e.newValue&&!storageConflict){storageConflict=true;pauseSession(false);openDialog('الحفظ مفتوح في نافذة أخرى','<p>تغيّر تقدم اللعبة في نافذة أخرى. أُوقف اللعب هنا لحماية الحفظ. أغلق النافذة الأخرى ثم حمّل أحدث تقدم للمتابعة.</p>','<button class="btn primary" data-action="reload">تحميل أحدث تقدم</button>');}});
document.addEventListener('error',e=>{if(e.target.tagName==='IMG'){e.target.classList.add('image-error');e.target.alt='تعذّر عرض الصورة. يمكنك تخطي السؤال بالمساعدة أو إظهار الصور من الإعدادات.';}},true);
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))closeDialog();});
$('#dialog').addEventListener('cancel',e=>{if(storageConflict)e.preventDefault();});
load();applyPrefs();const BANK_ERRORS=validateBank(QUESTION_BANK);if(BANK_ERRORS.length){$('#main').textContent='تعذّر التحقق من بنك الأسئلة. يرجى استخدام نسخة سليمة من اللعبة.';console.error(BANK_ERRORS);}else{render();if(!storageAvailable)setTimeout(()=>toast('الحفظ المحلي غير متاح أو تالف. يمكنك اللعب وتصدير تقدمك من الإعدادات.'),600);}
/* Read-only diagnostics for maintainers; no production network or analytics. */
window.SeenDiagnostics=Object.freeze({version:APP_VERSION,validateBank:()=>validateBank(QUESTION_BANK),questionCount:QUESTION_BANK.length,normalizeArabic,counts:()=>Object.fromEntries(CATEGORIES.map(c=>[c.id,QUESTION_BANK.filter(q=>q.category===c.id).length]))});
</script>
