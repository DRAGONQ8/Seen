name: Validate offline multiplayer release
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Use installed Chromium
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV,"CHROMIUM_PATH="+require("playwright").chromium.executablePath()+"\n")'
      - run: npm test
      - run: npm run test:stress
      - name: Generated HTML matches source
        run: git diff --exit-code -- index.html build-manifest.json
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seen-validation
          path: |
            /tmp/seen-*-report.json
            /tmp/seen-release-suites.json
          if-no-files-found: ignore
